
name: Build WordQuiz Pro Plus

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa dipendenze
        run: npm install

      - name: Compila modulo sintesi vocale
        run: npm run build:tts

      - name: Compila Windows
        run: npm run dist:win

      - name: Carica programma Windows
        uses: actions/upload-artifact@v4
        with:
          name: WordQuiz-Pro-Plus-Windows-Setup
          path: dist/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installa dipendenze
        run: npm install

      - name: Compila modulo sintesi vocale
        run: npm run build:tts

      - name: Aggiungi Android
        run: npx cap add android

      - name: Sincronizza Capacitor
        run: npx cap sync android

      - name: Compila APK
        run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug

      - name: Rinomina APK
        run: cp android/app/build/outputs/apk/debug/*.apk WordQuiz-Pro-Plus.apk

      - name: Carica APK
        uses: actions/upload-artifact@v4
        with:
          name: WordQuiz-Pro-Plus-apk
          path: WordQuiz-Pro-Plus.apk

  pwa:
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa dipendenze
        run: npm install

      - name: Compila modulo sintesi vocale
        run: npm run build:tts

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepara sito PWA
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Pubblica PWA
        id: deployment
        uses: actions/deploy-pages@v4
